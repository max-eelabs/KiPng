name: Build KiPng snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kipng-snapshot-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
      package-name: ${{ steps.build.outputs.package-name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build PCM snapshot
        id: build
        shell: pwsh
        run: |
          python .github/scripts/build_release.py --snapshot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem -Path dist/KiPng-*-SNAPSHOT.zip -File)
          if ($packages.Count -ne 1) { throw 'Expected one versioned PCM snapshot ZIP.' }
          "package-name=$($packages[0].Name)" >> $env:GITHUB_OUTPUT
      - name: Upload snapshot ZIP
        id: package
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.package-name }}
          archive: false
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          # The uploaded file is already the PCM ZIP.
          skip-decompress: true
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0
      - name: Publish the latest snapshot ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_PACKAGE: ${{ needs.build.outputs.package-name }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
              echo 'A newer commit is on main. Its build will publish the snapshot.'
              exit 0
          fi

          shopt -s nullglob
          downloads=(dist/*)
          if [[ ${#downloads[@]} -ne 1 || ! -f "${downloads[0]}" ]]; then
              echo 'Expected one intact PCM snapshot archive from the build job.' >&2
              exit 1
          fi
          filename="$SNAPSHOT_PACKAGE"
          asset="dist/$filename"
          if [[ "${downloads[0]}" != "$asset" ]]; then
              mv -- "${downloads[0]}" "$asset"
          fi
          unzip -p "$asset" metadata.json >/dev/null
          package=kipng-snapshot
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$package:latest"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd dist
          oras push "$ref" --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GH_REPO" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" "$filename:application/zip"
          digest=$(oras resolve "$ref")
          oras pull "$ref" -o "$RUNNER_TEMP/published"
          cmp "$filename" "$RUNNER_TEMP/published/$filename"

          # Moving latest leaves the previous manifest untagged, including across version bumps.
          endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/$package/versions"
          versions=$(gh api --paginate --slurp "$endpoint?per_page=100")
          jq -e --arg digest "$digest" 'add | any(.name == $digest and
              (.metadata.container.tags | index("latest") != null))' <<< "$versions" >/dev/null
          previous=$(jq -r --arg digest "$digest" 'add[] | select(.name != $digest and
              (.metadata.container.tags | length == 0)) | .id' <<< "$versions")
          while read -r id; do
              if [[ -n "$id" ]]; then
                  gh api --method DELETE "$endpoint/$id"
              fi
          done <<< "$previous"
