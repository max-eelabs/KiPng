name: Build KiPng snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build PCM snapshot
        run: python .github/scripts/build_release.py
      - name: Upload snapshot ZIP
        uses: actions/upload-artifact@v7
        with:
          name: KiPng-snapshot-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/KiPng-*-SNAPSHOT.zip
          if-no-files-found: error
