name: Build KiPng snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build PCM snapshot
        shell: pwsh
        run: |
          python .github/scripts/build_release.py --snapshot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem -Path dist/KiPng-*-SNAPSHOT.zip -File)
          if ($packages.Count -ne 1) { throw 'Expected one PCM snapshot ZIP.' }
          Move-Item -LiteralPath $packages[0].FullName -Destination dist/KiPng-SNAPSHOT.zip
      - name: Upload snapshot ZIP
        id: package
        uses: actions/upload-artifact@v7
        with:
          path: dist/KiPng-SNAPSHOT.zip
          archive: false
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: kipng-publish-snapshot
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      - name: Publish the latest snapshot ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
              echo 'A newer commit is on main. Its build will publish the snapshot.'
              exit 0
          fi

          asset=dist/KiPng-SNAPSHOT.zip
          title='KiPng development snapshot'
          notes="Build from main commit $GITHUB_SHA. Select KiPng-SNAPSHOT.zip in KiCad's Plugin and Content Manager using Install from File."
          if prerelease=$(gh release view snapshot --json isPrerelease --jq .isPrerelease); then
              if [[ "$prerelease" != true ]]; then
                  echo 'The snapshot tag already belongs to a stable release.' >&2
                  exit 1
              fi
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/snapshot" \
                  -f sha="$GITHUB_SHA" -F force=true --silent
              gh release upload snapshot "$asset" --clobber
              gh release edit snapshot --title "$title" --notes "$notes" --prerelease --latest=false --draft=false
          else
              gh release create snapshot "$asset" --target "$GITHUB_SHA" \
                  --title "$title" --notes "$notes" --prerelease --latest=false
          fi

          url="$GITHUB_SERVER_URL/$GH_REPO/releases/download/snapshot/KiPng-SNAPSHOT.zip"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --output "$RUNNER_TEMP/KiPng-SNAPSHOT.zip" "$url"
          cmp "$asset" "$RUNNER_TEMP/KiPng-SNAPSHOT.zip"
