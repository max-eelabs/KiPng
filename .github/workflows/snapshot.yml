name: Build KiPng snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
      package-name: ${{ steps.build.outputs.package-name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build PCM snapshot
        id: build
        shell: pwsh
        run: |
          python .github/scripts/build_release.py --snapshot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem -Path dist/KiPng-*-SNAPSHOT.zip -File)
          if ($packages.Count -ne 1) { throw 'Expected one versioned PCM snapshot ZIP.' }
          "package-name=$($packages[0].Name)" >> $env:GITHUB_OUTPUT
      - name: Upload snapshot ZIP
        id: package
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.package-name }}
          archive: false
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: kipng-publish-snapshot
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          # The uploaded file is already the PCM ZIP.
          skip-decompress: true
      - name: Publish the latest snapshot ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_PACKAGE: ${{ needs.build.outputs.package-name }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
              echo 'A newer commit is on main. Its build will publish the snapshot.'
              exit 0
          fi

          shopt -s nullglob
          downloads=(dist/*)
          if [[ ${#downloads[@]} -ne 1 || ! -f "${downloads[0]}" ]]; then
              echo 'Expected one intact PCM snapshot archive from the build job.' >&2
              exit 1
          fi
          filename="$SNAPSHOT_PACKAGE"
          asset="dist/$filename"
          if [[ "${downloads[0]}" != "$asset" ]]; then
              mv -- "${downloads[0]}" "$asset"
          fi
          unzip -p "$asset" metadata.json >/dev/null
          version=${filename#KiPng-}
          title="KiPng ${version%.zip}"
          notes="Build from main commit $GITHUB_SHA. Select $filename in KiCad's Plugin and Content Manager using Install from File."
          if prerelease=$(gh release view snapshot --json isPrerelease --jq .isPrerelease); then
              if [[ "$prerelease" != true ]]; then
                  echo 'The snapshot tag already belongs to a stable release.' >&2
                  exit 1
              fi
              gh release upload snapshot "$asset" --clobber
              gh release edit snapshot --title "$title" --notes "$notes" --prerelease --latest=false --draft=false
          else
              gh release create snapshot "$asset" --target "$GITHUB_SHA" \
                  --title "$title" --notes "$notes" --prerelease --latest=false
          fi

          url="$GITHUB_SERVER_URL/$GH_REPO/releases/download/snapshot/$filename"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --output "$RUNNER_TEMP/$filename" "$url"
          cmp "$asset" "$RUNNER_TEMP/$filename"

          snapshot_sha=$(gh api "repos/$GH_REPO/git/ref/tags/snapshot" --jq .object.sha)
          if [[ "$snapshot_sha" != "$GITHUB_SHA" ]]; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/snapshot" \
                  -f sha="$GITHUB_SHA" -F force=true --silent
          fi

          assets=$(gh release view snapshot --json assets --jq '.assets[].name')
          while IFS= read -r previous; do
              if [[ "$previous" == "$filename" ]]; then
                  continue
              fi
              if [[ "$previous" == KiPng-SNAPSHOT.zip || "$previous" =~ ^KiPng-[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT\.zip$ ]]; then
                  gh release delete-asset snapshot "$previous" --yes
              fi
          done <<< "$assets"
