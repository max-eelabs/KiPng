name: KiPng CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            plugin/requirements.txt
      - name: Check GPL license notices
        run: python .github/scripts/check_license.py
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0
      - run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - run: ruff check .
      - run: ruff format --check .
      - name: Check CLI entrypoint
        run: python plugin/render.py --help
      - run: python -m pytest
